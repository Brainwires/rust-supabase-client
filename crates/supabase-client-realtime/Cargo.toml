[package]
name = "supabase-client-realtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Realtime WebSocket client for supabase-client"
readme = "README.md"
keywords = ["supabase", "realtime", "websocket", "phoenix-channels", "pubsub"]
categories = ["network-programming", "web-programming::websocket"]

[features]
default = ["rustls"]
## wss:// via rustls (aws-lc-rs crypto, OS trust store). No OpenSSL needed.
## The TLS config is built here with aws-lc-rs (or the provider the application
## installed) and the OS certificate verifier, as reqwest's `rustls` feature does.
rustls = [
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "tokio-tungstenite/rustls-tls-native-roots",
    "supabase-client-core/rustls",
]
## wss:// via the platform library (OpenSSL on Linux, SChannel, Secure Transport).
native-tls = ["tokio-tungstenite/native-tls", "supabase-client-core/native-tls"]

[dependencies]
supabase-client-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true }
futures-util.workspace = true
url.workspace = true
chrono.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time", "net", "macros"] }
tokio-tungstenite.workspace = true
# `rustls` feature: build the wss:// TLS config with an explicit crypto
# provider. The rustls version must match the one tokio-tungstenite uses
# (Connector::Rustls); rustls-platform-verifier is the verifier reqwest's
# `rustls` feature uses, so HTTP and WebSocket trust the same OS store.
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = { version = "0.7", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["WebSocket", "MessageEvent", "ErrorEvent", "CloseEvent", "BinaryType"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
gloo-timers.workspace = true
js-sys.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
sqlx = { workspace = true }
supabase-client-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Test-only: compile both rustls backends (as an application that also pulls
# in a ring-based rustls user would) to check the realtime TLS config does not
# depend on rustls picking a process-level provider. Not part of the normal
# dependency tree: the default build has aws-lc-rs only.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "aws_lc_rs"] }
