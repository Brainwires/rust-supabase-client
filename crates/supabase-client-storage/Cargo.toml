[package]
name = "supabase-client-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Storage HTTP client for supabase-client"
readme = "README.md"
keywords = ["supabase", "storage", "object-storage", "file-upload", "s3"]
categories = ["filesystem", "web-programming::http-client"]

[features]
default = ["rustls"]
## TLS via rustls (aws-lc-rs crypto, OS trust store). No OpenSSL needed.
rustls = ["reqwest/rustls", "supabase-client-core/rustls"]
## TLS via the platform library (OpenSSL on Linux, SChannel, Secure Transport).
native-tls = ["reqwest/native-tls", "supabase-client-core/native-tls"]

[dependencies]
supabase-client-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
url.workspace = true
base64.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
wiremock.workspace = true
serde_json.workspace = true
