[package]
name = "supabase-client-functions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Edge Functions client for supabase-client"
readme = "README.md"
keywords = ["supabase", "edge-functions", "serverless", "deno", "functions"]
categories = ["web-programming::http-client"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls"]
## TLS via rustls (aws-lc-rs crypto, OS trust store). No OpenSSL needed.
rustls = ["reqwest/rustls", "supabase-client-core/rustls"]
## TLS via the platform library (OpenSSL on Linux, SChannel, Secure Transport).
native-tls = ["reqwest/native-tls", "supabase-client-core/native-tls"]

[dependencies]
supabase-client-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
wiremock.workspace = true
serde_json.workspace = true
