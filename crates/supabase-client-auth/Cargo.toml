[package]
name = "supabase-client-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Auth (GoTrue) client for supabase-client"
readme = "README.md"
keywords = ["supabase", "auth", "gotrue", "authentication", "oauth"]
categories = ["authentication", "web-programming::http-client"]

[features]
default = ["rustls"]
## TLS via rustls (aws-lc-rs crypto, OS trust store). No OpenSSL needed.
rustls = ["reqwest/rustls", "supabase-client-core/rustls"]
## TLS via the platform library (OpenSSL on Linux, SChannel, Secure Transport).
native-tls = ["reqwest/native-tls", "supabase-client-core/native-tls"]

[dependencies]
supabase-client-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
tokio = { workspace = true }
chrono.workspace = true
uuid.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
totp-rs = "6"
wiremock.workspace = true
serde_json.workspace = true
