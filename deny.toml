# cargo-deny configuration. Run with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Unmaintained/unsound/yanked crates fail the check; vulnerabilities always do.
yanked = "deny"
ignore = []

[licenses]
# Licenses compatible with distributing this crate under MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace are not wildcards for publishing.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
