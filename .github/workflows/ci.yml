name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Unit tests
        # Integration tests under crates/*/tests need a live Supabase instance.
        run: cargo test --workspace --lib

      - name: Clippy
        # Not -D warnings yet: main carries pre-existing lints.
        run: cargo clippy --workspace

      - name: Docs
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  wasm:
    name: Build wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Build wasm crate
        run: cargo build -p supabase-client-wasm --target wasm32-unknown-unknown
